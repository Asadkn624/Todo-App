<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professional Login Page</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/login.css" />
  </head>
  <body>
    <div class="login-box p-4 p-md-5">
      <div class="text-center mb-4">
        <h1 class="header mb-2">LOGIN</h1>
        <p class="text-muted">Please sign in to access your account</p>
      </div>

      <form onsubmit="login(event)">
        <div class="mb-3">
          <input
            type="email"
            name="email"
            id="email"
            class="form-control form-control-lg"
            placeholder="Email Address"
            required
          />
        </div>

        <div class="mb-3">
          <input
            type="password"
            name="password"
            id="password"
            class="form-control form-control-lg"
            placeholder="Password"
            required
          />
        </div>

        <div class="d-grid mb-3">
          <button
            type="submit"
            class="btn btn-login btn-primary btn-lg text-white fw-bold"
          >
            Sign In
          </button>
        </div>

        <div class="text-center mt-4">
          <p class="text-muted">
            Don't have an account?
            <a
              href="./html/register.html"
              class="text-decoration-none fw-bold"
              style="color: #3700ff"
              >Register here</a
            >
          </p>
        </div>
      </form>
    </div>

    <!-- Bootstrap 5 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/login.js"></script>
  </body>
</html>
