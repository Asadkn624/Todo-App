<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professional Todo List</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="../css/home.css" />
  </head>

  <body>
    <header>
      <nav>
        <div class="fluid-container d-flex justify-content-between p-3">
          <div class="brand-name">
            <h2>Todo</h2>
          </div>
          <div class="logout">
            <button class="btn btn-primary" onclick="logout()">Logout</button>
          </div>
        </div>
      </nav>
    </header>

    <div class="container mt-5 p-5 rounded">
      <div class="row">
        <div class="col-md-12">
          <div class="title-box">
            <span class="text-white fs-5" id="userName"></span>
            <h1 class="col-md-12 text-center text-white">Todo App</h1>
          </div>
        </div>
      </div>

      <div class="input-tasks mt-5">
        <div class="row">
          <div class="col-md-12">
            <form id="task-form" onsubmit="addTask(event)">
              <!-- Task Title -->
              <div class="mb-3">
                <input
                  type="text"
                  id="task-input"
                  class="form-control"
                  placeholder="Add a new task title"
                  required
                />
              </div>

              <div class="mb-3">
                <textarea
                  id="task-desc"
                  class="form-control"
                  rows="3"
                  placeholder="Add task description"
                ></textarea>
              </div>

              <div class="d-grid">
                <button class="btn btn-primary" type="submit">Add Task</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <h5 class="mt-4 text-start">Your Tasks:</h5>
      <ul class="list-group text-start" id="taskList"></ul>

      <div class="row mt-4">
        <div class="col-md-12">
          <p class="text-center text-white">
            Welcome to the Professional Todo List App!
          </p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
